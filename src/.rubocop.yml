plugins:
  - rubocop-rails

Layout/LineLength:
  Max: 130

Metrics/BlockLength:
  Exclude:
    - 'spec/**/*'

Metrics/MethodLength:
  Max: 25

Metrics/ClassLength:
  Max: 150

Rails/I18nLocaleTexts:
  Enabled: false

Style/Documentation:
  Enabled: false

AllCops:
  TargetRubyVersion: 3.4 # Rubyバージョンの記法
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - 'config/**/*'
    - 'bin/*'
    - 'db/migrate/**/*'
    - 'db/schema.rb'
    - 'script/**/*'
    - 'node_modules/**/*'
    - 'spec/spec_helper.rb' # ややこしい為
    - 'vendor/**/*'
    - 'Gemfile'
    - '.git/**/*'
