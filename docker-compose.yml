version: '3.8'

services:
  db:
    image: mysql:8.0
    command: --authentication_policy=mysql_native_password
    volumes:
      - ./src/db/mysql_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: password # (config/database.yml)
      TZ: Asia/Tokyo # 日本時間に統一
  web:
    build:
      context: .
      args:
        RAILS_ENV: development   # 明示的につけておく
    command: /start.sh
    volumes:
      - ./src:/app
    ports:
      - "3000:3000"
    tty: true # -t
    stdin_open: true # -i
    depends_on:
      - db # (config/database.yml)
    environment: # Rspec用
      RAILS_ENV: development
      TZ: Asia/Tokyo
      SELENIUM_DRIVER_UR: "http://chrome:4444/wd/hub"

  chrome: # テスト実行用コンテナ
    image: selenium/standalone-chrome-debug
    ports:
      - '4444:4444'
      - '5900:5900' # 💡 VNCViewerなどでブラウザの動きを画面で確認したい場合に便利
    depends_on:
      - web

