version: '3.8'

services:
  db:
    image: postgres:17-alpine # 本番環境に合わせる
    volumes:
      - db_data:/var/lib/postgresql/data #保存先
    environment:
      POSTGRES_USER: root # (config/database.yml)
      POSTGRES_PASSWORD: password # (config/database.yml)
      TZ: Asia/Tokyo # 日本時間に統一
    ports:
      - "5432:5432"
  web:
    build:
      context: .
      args:
        RAILS_ENV: development # 明示的につけておく
    command: /start.sh
    volumes:
      - ./src:/app:cached # 末尾に「:cached」を追加▶︎ファイル同期を強制＆高速化
    ports:
      - "3000:3000"
    tty: true # -t
    stdin_open: true # -i
    depends_on:
      - db # (config/database.yml)
    environment:
      RAILS_ENV: development
      RACK_ENV: development
      TZ: Asia/Tokyo
      SELENIUM_DRIVER_URL: "http://chrome:4444/wd/hub"

  chrome: # テスト実行用コンテナ
    image: selenium/standalone-chrome-debug
    ports:
      - '4444:4444'
      - '5900:5900' # 💡 VNCViewerなどでブラウザの動きを画面で確認したい場合に便利
    depends_on:
      - web

# ボリュームの定義
volumes:
  db_data:
